<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CAATELINK | Reset Password</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    h1 {
      color: #0b8f55;
      margin-top: 0;
    }

    p {
      color: #555;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #0b8f55;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>CAATELINK</h1>

    <h2>Reset Password</h2>

    <p>
      Enter your new password below.
    </p>

    <input
      type="password"
      id="newPassword"
      placeholder="New password"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
    >

    <button onclick="updatePassword()">
      Update Password
    </button>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://mkjvlotgilihlrgtanps.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_1iq8mtaSTBmRVhcLTUrlFw_RkQfw6Ix";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    async function updatePassword() {

      const password =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");

      if (!password || !confirmPassword) {
        message.textContent =
          "Please enter your new password.";
        return;
      }

      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "Passwords do not match.";
        return;
      }

      message.textContent =
        "Updating password...";

      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if (error) {
        console.error(error);

        message.textContent =
          error.message;

        return;
      }

      message.textContent =
        "Password updated successfully! You can now sign in.";

      setTimeout(() => {
        window.location.href =
          "index.html";
      }, 2000);
    }

  </script>

</body>
</html>
