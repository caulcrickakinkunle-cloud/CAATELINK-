<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Dashboard | CAATELINK</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sign-out {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .welcome p {
      margin: 0;
      color: #6b7280;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .request-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .request-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .request-card p {
      margin: 7px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 20px 5px;
    }

    #notification {
      position: fixed;
      top: 20px;
      right: 20px;
      left: 20px;
      max-width: 420px;
      margin: auto;
      z-index: 99999;
      padding: 14px 18px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      display: none;
    }

    .loading {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px 15px;
      }

      .brand {
        font-size: 19px;
      }

      .sign-out {
        padding: 9px 12px;
        font-size: 13px;
      }

      main {
        padding: 20px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .welcome h1 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


  <div id="notification"></div>


  <header>

    <div class="brand">
      CAATELINK
    </div>

    <button
      class="sign-out"
      onclick="signOutUser()"
    >
      Sign Out
    </button>

  </header>


  <main>


    <section class="welcome">

      <h1>
        Welcome, <span id="customerName">Customer</span>
      </h1>

      <p>
        Request trusted professionals for your technical needs.
      </p>

    </section>



    <section class="card">

      <h2>
        Request a Professional
      </h2>


      <form id="requestForm">


        <div class="form-group">

          <label for="service">
            Service
          </label>

          <select
            id="service"
            required
          >

            <option value="">
              Select a service
            </option>

            <option value="Electrical">
              Electrical
            </option>

            <option value="Automation">
              Automation
            </option>

            <option value="Smart Lock">
              Smart Lock
            </option>

            <option value="Solar">
              Solar
            </option>

            <option value="Appliance Installation">
              Appliance Installation
            </option>

            <option value="Other Technical Service">
              Other Technical Service
            </option>

          </select>

        </div>



        <div class="form-group">

          <label for="jobTitle">
            Job Title
          </label>

          <input
            type="text"
            id="jobTitle"
            placeholder="e.g. Install 4 electrical sockets"
            required
          >

        </div>



        <div class="form-group">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Describe what you need the professional to do..."
            required
          ></textarea>

        </div>



        <div class="form-group">

          <label for="location">
            Area
          </label>

          <input
            type="text"
            id="location"
            placeholder="e.g. Ikeja"
            required
          >

        </div>



        <div class="form-group">

          <label for="preferredDate">
            Preferred Date
          </label>

          <input
            type="date"
            id="preferredDate"
          >

        </div>



        <div class="form-group">

          <label for="preferredTime">
            Preferred Time
          </label>

          <input
            type="text"
            id="preferredTime"
            placeholder="e.g. 10:00am"
          >

        </div>



        <div class="form-group">

          <label for="billingType">
            Billing Preference
          </label>

          <select id="billingType">

            <option value="fixed_quote">
              Fixed Quote
            </option>

            <option value="hourly_labour">
              Hourly Labour
            </option>

            <option value="inspection_first">
              Inspection First
            </option>

            <option value="materials_workmanship">
              Materials + Workmanship
            </option>

          </select>

        </div>



        <button
          type="submit"
          class="submit-button"
          id="submitButton"
        >
          Request a Professional
        </button>


      </form>

    </section>



    <section class="card">

      <h2>
        My Requests
      </h2>

      <div id="myRequests">

        <div class="loading">
          Loading your requests...
        </div>

      </div>

    </section>


  </main>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /*
      CAATELINK SUPABASE CONNECTION
    */

    const SUPABASE_URL =
      "https://mkjvlotgilihlrgtanps.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_1iq8mtaSTBmRVhcLTUrlFw_RkQfw6Ix";
 

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );



    /*
      NOTIFICATION
    */

    function showNotification(message) {

      const notification =
        document.getElementById("notification");

      notification.textContent = message;

      notification.style.display = "block";

      setTimeout(() => {

        notification.style.display = "none";

      }, 3500);

    }



    /*
      LOAD CUSTOMER DASHBOARD
    */

    async function loadCustomerDashboard() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data ||
        !data.session ||
        !data.session.user
      ) {

        window.location.href = "index.html";

        return;

      }


      const user =
        data.session.user;


      /*
        Get customer name
      */

      const customerName =
        user.user_metadata?.full_name ||
        user.email ||
        "Customer";


      document.getElementById(
        "customerName"
      ).textContent = customerName;


      /*
        Load requests
      */

      await loadMyRequests();

    }



    /*
      LOAD CUSTOMER REQUESTS
    */

    async function loadMyRequests() {

      const container =
        document.getElementById("myRequests");


      container.innerHTML =
        '<div class="loading">Loading your requests...</div>';


      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (
        sessionError ||
        !sessionData ||
        !sessionData.session
      ) {

        container.innerHTML =
          '<div class="empty">Please sign in again.</div>';

        return;

      }


      const user =
        sessionData.session.user;


      const {
        data: requests,
        error
      } =
        await supabaseClient
          .from("service_requests")
          .select(
            "id, title, service, description, location, preferred_date, preferred_time, billing_type, status, created_at"
          )
          .eq(
            "customer_id",
            user.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "LOAD REQUESTS ERROR:",
          error
        );


        container.innerHTML = `
          <div class="empty">

            Unable to load your requests.

            <br><br>

            ${error.message}

          </div>
        `;

        return;

      }


      if (
        !requests ||
        requests.length === 0
      ) {

        container.innerHTML = `
          <div class="empty">
            You have not created any requests yet.
          </div>
        `;

        return;

      }


      container.innerHTML =
        requests.map(request => `

          <div class="request-card">

            <h3>
              ${escapeHtml(
                request.title ||
                "Technical Request"
              )}
            </h3>

            <p>
              ${escapeHtml(
                request.description ||
                "No description provided."
              )}
            </p>

            <p>
              <strong>Service:</strong>
              ${escapeHtml(
                request.service ||
                "Not specified"
              )}
            </p>

            <p>
              <strong>Location:</strong>
              ${escapeHtml(
                request.location ||
                "Not specified"
              )}
            </p>

            <p>
              <strong>Preferred date:</strong>
              ${
                request.preferred_date ||
                "Flexible"
              }
            </p>

            <p>
              <strong>Preferred time:</strong>
              ${escapeHtml(
                request.preferred_time ||
                "Flexible"
              )}
            </p>

            <p>
              <strong>Billing:</strong>
              ${escapeHtml(
                request.billing_type ||
                "Not specified"
              )}
            </p>

            <p>
              <strong>Status:</strong>

              <span class="status">
                ${escapeHtml(
                  request.status ||
                  "pending"
                )}
              </span>

            </p>

          </div>

        `).join("");

    }



    /*
      SUBMIT REQUEST
    */

    async function submitRequest(event) {

      event.preventDefault();


      const submitButton =
        document.getElementById(
          "submitButton"
        );


      submitButton.disabled = true;

      submitButton.textContent =
        "Submitting...";


      try {

        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth.getSession();


        if (
          sessionError ||
          !sessionData ||
          !sessionData.session
        ) {

          showNotification(
            "Your session has expired. Please sign in again."
          );

          return;

        }


        const user =
          sessionData.session.user;


        const service =
          document
            .getElementById("service")
            .value
            .trim();


        const title =
          document
            .getElementById("jobTitle")
            .value
            .trim();


        const description =
          document
            .getElementById("description")
            .value
            .trim();


        const location =
          document
            .getElementById("location")
            .value
            .trim();


        const preferredDate =
          document
            .getElementById("preferredDate")
            .value;


        const preferredTime =
          document
            .getElementById("preferredTime")
            .value
            .trim();


        const billingType =
          document
            .getElementById("billingType")
            .value;


        if (
          !service ||
          !title ||
          !description ||
          !location
        ) {

          showNotification(
            "Please complete all required fields."
          );

          return;

        }


        const {
          data,
          error
        } =
          await supabaseClient
            .from("service_requests")
            .insert({

              customer_id:
                user.id,

              title:
                title,

              service:
                service,

              description:
                description,

              location:
                location,

              preferred_date:
                preferredDate || null,

              preferred_time:
                preferredTime || null,

              billing_type:
                billingType || null,

              status:
                "pending"

            })
            .select()
            .single();


        if (error) {

          console.error(
            "SUBMIT REQUEST ERROR:",
            error
          );

          showNotification(
            error.message
          );

          return;

        }


        console.log(
          "REQUEST CREATED:",
          data
        );


        showNotification(
          "Request submitted successfully."
        );


        document
          .getElementById("requestForm")
          .reset();


        await loadMyRequests();


      } finally {

        submitButton.disabled = false;

        submitButton.textContent =
          "Request a Professional";

      }

    }



    /*
      SIGN OUT
    */

    async function signOutUser() {

      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if (error) {

        showNotification(
          error.message
        );

        return;

      }


      window.location.href =
        "index.html";

    }



    /*
      BASIC HTML SAFETY
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /*
      FORM LISTENER
    */

    document
      .getElementById("requestForm")
      .addEventListener(
        "submit",
        submitRequest
      );



    /*
      START DASHBOARD
    */

    loadCustomerDashboard();

  </script>


</body>

</html></html>
