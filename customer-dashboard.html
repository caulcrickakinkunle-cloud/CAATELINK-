<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Dashboard | CAATELINK</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #222;
    }

    header {
      background: #0b8f55;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header button {
      background: white;
      color: #0b8f55;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .primary-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #0b8f55;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .job-card {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 10px;
      background: #fff;
    }

    .job-card h3 {
      margin-top: 0;
      color: #0b8f55;
    }

    .job-card p {
      margin: 7px 0;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #eee;
      font-size: 13px;
      font-weight: bold;
    }

    .status-open {
      background: #dff7e9;
      color: #08753f;
    }

    #caatelinkNotification {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      padding: 14px 20px;
      background: #111;
      color: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      font-size: 14px;
    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <h1>
      CAATELINK
    </h1>

    <button onclick="signOutUser()">
      Sign Out
    </button>

  </header>


  <main class="container">


    <!-- WELCOME -->

    <section class="card">

      <h2 id="welcomeName">
        Welcome, Customer
      </h2>

      <p>
        Request trusted professionals for your technical needs.
      </p>

    </section>


    <!-- REQUEST A PROFESSIONAL -->

    <section class="card">

      <h2>
        Request a Professional
      </h2>


      <form id="jobForm">


        <label for="serviceCategory">
          Service
        </label>

        <select
          id="serviceCategory"
          required
        >

          <option value="">
            Select a service
          </option>

          <option value="Electrical">
            Electrical
          </option>

          <option value="Automation">
            Automation
          </option>

          <option value="Smart Lock">
            Smart Lock
          </option>

          <option value="Solar">
            Solar
          </option>

          <option value="Plumbing">
            Plumbing
          </option>

          <option value="Air Conditioning">
            Air Conditioning
          </option>

          <option value="Other">
            Other
          </option>

        </select>


        <label for="jobTitle">
          Job Title
        </label>

        <input
          type="text"
          id="jobTitle"
          placeholder="e.g. Install 4 electrical sockets"
          required
        >


        <label for="jobDescription">
          Description
        </label>

        <textarea
          id="jobDescription"
          placeholder="Describe what you need done..."
          required
        ></textarea>


        <label for="locationArea">
          Area
        </label>

        <input
          type="text"
          id="locationArea"
          placeholder="e.g. Ikeja, Lagos"
          required
        >


        <label for="preferredDate">
          Preferred Date
        </label>

        <input
          type="date"
          id="preferredDate"
        >


        <label for="preferredTime">
          Preferred Time
        </label>

        <input
          type="text"
          id="preferredTime"
          placeholder="e.g. 10:00am"
        >


        <label for="billingType">
          Billing Preference
        </label>

        <select
          id="billingType"
          required
        >

          <option value="fixed_quote">
            Fixed Quote
          </option>

          <option value="hourly_labour">
            Hourly Labour
          </option>

          <option value="inspection_first">
            Inspection First
          </option>

          <option value="materials_workmanship">
            Materials + Workmanship
          </option>

        </select>


        <button
          type="submit"
          class="primary-button"
          id="submitJobButton"
        >
          Request a Professional
        </button>


      </form>

    </section>


    <!-- MY REQUESTS -->

    <section class="card">

      <h2>
        My Requests
      </h2>

      <div id="myJobsList">

        <p>
          Loading your requests...
        </p>

      </div>

    </section>


  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /* =========================
       SUPABASE
    ========================= */


    const SUPABASE_URL =
      "https://mkjvlotgilihlrgtanps.supabase.co";


    /*
      IMPORTANT:
      Put the SAME publishable key
      you already use in app.js here.
    */

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_1iq8mtaSTBmRVhcLTUrlFw_RkQfw6Ix";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       NOTIFICATION
    ========================= */


    function showNotification(message) {

      const existing =
        document.getElementById(
          "caatelinkNotification"
        );

      if (existing) {
        existing.remove();
      }


      const notification =
        document.createElement("div");


      notification.id =
        "caatelinkNotification";


      notification.textContent =
        message;


      document.body.appendChild(
        notification
      );


      setTimeout(() => {

        notification.remove();

      }, 3000);

    }


    /* =========================
       LOAD CUSTOMER DASHBOARD
    ========================= */


    async function loadCustomerDashboard() {

  console.log("Customer dashboard starting...");

  /*
    Give Supabase a moment to restore
    the login session from browser storage.
  */
  await new Promise(resolve => {
    setTimeout(resolve, 800);
  });


  /*
    First check the stored session.
  */
  const {
    data: sessionData,
    error: sessionError
  } = await supabaseClient.auth.getSession();


  console.log(
    "CUSTOMER SESSION:",
    sessionData
  );

  console.log(
    "SESSION ERROR:",
    sessionError
  );


  if (
    sessionError ||
    !sessionData ||
    !sessionData.session ||
    !sessionData.session.user
  ) {

    console.log(
      "No customer session found."
    );

    window.location.href =
      "index.html";

    return;
  }


  const user =
    sessionData.session.user;


  console.log(
    "CUSTOMER LOGGED IN:",
    user.id
  );


  /*
    Load profile
  */

  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("full_name, email")
      .eq("id", user.id)
      .maybeSingle();


  if (profileError) {

    console.error(
      "Profile error:",
      profileError
    );

  }


  if (profile) {

    document.getElementById(
      "welcomeName"
    ).textContent =
      "Welcome, " +
      (
        profile.full_name ||
        "Customer"
      );

  }


  /*
    Load customer's jobs
  */

  await loadMyJobs();

}

    /* =========================
       LOAD MY JOBS
    ========================= */


 async function submitJob(event) {

  event.preventDefault();

  const button =
    document.getElementById(
      "submitJobButton"
    );

  const serviceCategory =
    document.getElementById(
      "serviceCategory"
    ).value;

  const jobTitle =
    document.getElementById(
      "jobTitle"
    ).value.trim();

  const jobDescription =
    document.getElementById(
      "jobDescription"
    ).value.trim();

  const locationArea =
    document.getElementById(
      "locationArea"
    ).value.trim();

  const preferredDate =
    document.getElementById(
      "preferredDate"
    ).value;

  const preferredTime =
    document.getElementById(
      "preferredTime"
    ).value.trim();

  const billingType =
    document.getElementById(
      "billingType"
    ).value;


  if (
    !serviceCategory ||
    !jobTitle ||
    !jobDescription ||
    !locationArea
  ) {

    showNotification(
      "Please complete all required fields."
    );

    return;
  }


  /*
    Get logged-in customer
  */

  const {
    data: { user },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (userError || !user) {

    showNotification(
      "Please sign in again."
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Creating request...";


  /*
    Create request inside
    service_requests
  */

  const {
    data: request,
    error
  } =
    await supabaseClient
      .from("service_requests")
      .insert({

        customer_id:
          user.id,

        title:
          jobTitle,

        service:
          serviceCategory,

        description:
          jobDescription,

        location:
          locationArea,

        preferred_date:
          preferredDate ||
          null,

        preferred_time:
          preferredTime ||
          null,

        billing_type:
          billingType,

        status:
          "pending"

      })
      .select()
      .single();


  if (error) {

    console.error(
      "Create request error:",
      error
    );

    showNotification(
      "Could not create request: " +
      error.message
    );

    button.disabled = false;

    button.textContent =
      "Request a Professional";

    return;
  }


  console.log(
    "Created service request:",
    request
  );


  showNotification(
    "Professional request created successfully!"
  );


  document
    .getElementById("jobForm")
    .reset();


  button.disabled = false;

  button.textContent =
    "Request a Professional";


  /*
    Reload customer's requests
  */

  await loadMyJobs();

}


    /* =========================
       SUBMIT JOB
    ========================= */


    async function submitJob() {
  const {
    data: { session },
    error: sessionError
  } = await supabaseClient.auth.getSession();

  if (sessionError || !session || !session.user) {
    showNotification("Please sign in first.");
    return;
  }

  const title = document.getElementById("jobTitle").value.trim();
  const service = document.getElementById("jobService").value;
  const description = document.getElementById("jobDescription").value.trim();
  const location = document.getElementById("jobLocation").value.trim();
  const preferredDate = document.getElementById("jobDate").value;
  const preferredTime = document.getElementById("jobTime").value;
  const billingType = document.getElementById("billingType").value;

  if (!title || !service || !description || !location) {
    showNotification("Please complete all required fields.");
    return;
  }

  showNotification("Submitting your request...");

  const { data, error } = await supabaseClient
    .from("service_requests")
    .insert({
      customer_id: session.user.id,
      title: title,
      service: service,
      description: description,
      location: location,
      preferred_date: preferredDate || null,
      preferred_time: preferredTime || null,
      billing_type: billingType || null,
      status: "pending"
    })
    .select()
    .single();

  if (error) {
    console.error("Submit request error:", error);
    showNotification(error.message);
    return;
  }

  console.log("Request created:", data);

  showNotification("Request submitted successfully.");

  document.getElementById("jobForm").reset();

  await loadMyJobs();
}


    /* =========================
       SIGN OUT
    ========================= */


    async function signOutUser() {


      await supabaseClient.auth.signOut();


      window.location.href =
        "index.html";

    }


    /* =========================
       FORM EVENT
    ========================= */


    document
      .getElementById("jobForm")
      .addEventListener(
        "submit",
        submitJob
      );


    /* =========================
       START DASHBOARD
    ========================= */


    loadCustomerDashboard();


  </script>

</body>

</html>
